backend:
  name: turbo-github
  turbo_site_id: 474344ca-b0e1-41db-a8e4-ce0abaa4fe81
  branch: main

media_folder: "images/uploads"
public_folder: "/p/images/uploads"

collections:
  - name: "articles"
    label: "مقالات"
    folder: "content/articles"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "عنوان", name: "title", widget: "string" }
      - { label: "تاریخ انتشار", name: "date", widget: "datetime" }
      - { label: "تصویر شاخص", name: "thumbnail", widget: "image", required: false }
      - { label: "متن مقاله", name: "body", widget: "markdown" }

  - name: "portfolio"
    label: "نمونه‌کارها"
    folder: "content/portfolio"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "عنوان پروژه", name: "title", widget: "string" }
      - { label: "توضیحات", name: "description", widget: "text" }
      - { label: "تصویر کاور", name: "cover", widget: "image" }
      - { label: "گالری تصاویر", name: "gallery", widget: "list", required: false, field: { label: "تصویر", name: "image", widget: "image" } }
      - { label: "شرح پروژه", name: "body", widget: "markdown" }
