backend:
  name: turbo-github
  turbo_site_id: 474344ca-b0e1-41db-a8e4-ce0abaa4fe81
  branch: main

media_folder: "images/uploads"
public_folder: "/p/images/uploads"

collections:
  - name: articles
    label: Articles
    folder: content/articles
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publication date, name: date, widget: datetime }
      - { label: Featured image, name: thumbnail, widget: image, required: false }
      - { label: Article body, name: body, widget: markdown }

  - name: portfolio
    label: Portfolio
    folder: content/portfolio
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Project title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Cover image, name: cover, widget: image }
      - label: Gallery
        name: gallery
        widget: list
        required: false
        field: { label: Image, name: image, widget: image }
      - { label: Project details, name: body, widget: markdown }
